global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The API's own metrics: request counts, latency, logins, payments
  - job_name: gym-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:5000"]

  # The server itself: CPU, memory, disk
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
