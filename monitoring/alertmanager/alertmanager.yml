# Alerts are grouped and shown in the Alertmanager UI (port 9093) and in Grafana.
# No external notifier (Slack, e-mail) is configured: add a receiver here to enable one.
route:
  receiver: default
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: default
