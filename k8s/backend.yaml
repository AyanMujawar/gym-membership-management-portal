apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0       # never drop below the desired count while updating: zero downtime
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: gym-portal-backend:local      # replaced with the tested image tag by scripts/k8s-deploy.sh
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: gym-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gym-secrets
                  key: DB_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gym-secrets
                  key: SECRET_KEY
          startupProbe:
            httpGet:
              path: /api/health/live
              port: 5000
            periodSeconds: 3
            failureThreshold: 20
          # Liveness: is the process alive? Restart it if not. It never checks the database, so a database
          # outage cannot trigger a pointless restart storm.
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 5000
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: can it serve traffic? Fails while the database is unreachable, so the Service
          # stops sending requests to this pod until it recovers.
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 5000
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend        # the frontend's nginx reaches the API at http://backend:5000
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
