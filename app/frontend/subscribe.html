<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Subscribe - FitZone Gym</title>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="index.html">🏋️ Fit<span>Zone</span></a>
        <div id="navLinks"></div>
    </nav>

    <h1 class="page-title">Confirm & Pay</h1>
    <div class="form-container">
        <div id="planSummary"></div>
        <form id="payForm">
            <label>Payment method</label>
            <select id="method">
                <option value="UPI">UPI</option>
                <option value="Card">Credit / Debit Card</option>
                <option value="NetBanking">Net Banking</option>
            </select>
            <button type="submit" class="btn" id="payBtn">Pay</button>
        </form>
        <p class="message" id="message"></p>
        <p style="color: var(--text-light); font-size: 12px;">This is a simulated payment - no real money is charged.</p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/subscribe.js"></script>
</body>
</html>
